[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media_harvest"
version = "0.1.0"
description = "Pixabay free media harvester CLI (sfx/music/image/video) with central library and license manifest"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "playwright",
    "PyYAML",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mediaharvest = "media_harvest.cli:main"

[tool.setuptools.packages.find]
include = ["media_harvest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
